name: 更新 Shadowrocket 订阅

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "sources.txt"
      - "scripts/aggregate.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 聚合订阅
        run: python scripts/aggregate.py
      - name: 提交更新后的订阅
        run: |
          if git diff --quiet -- subscribe.txt; then
            echo "订阅内容没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscribe.txt
          git commit -m "自动更新 Shadowrocket 订阅"
          git push
